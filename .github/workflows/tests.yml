name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/*.yml"
      - poetry.lock
      - pyproject.toml
      - "tests/**"

  pull_request:
    branches:
      - main
    paths:
      - "**.py"
      - ".github/workflows/*.yml"
      - poetry.lock
      - pyproject.toml
      - "tests/**"

jobs:
  tests:
    name: tests 3.10 / ubuntu-latest
    runs-on: ubuntu-latest

    env:
      FORCE_COLOR: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -q --no-install-recommends --no-install-suggests \
            libhts-dev \
            libssl-dev

      - name: Upgrade pip
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip
          pip --version

      - name: Install Poetry
        run: |
          pipx install --pip-args=--constraint=.github/workflows/constraints.txt poetry==1.8.5
          poetry --version

      - name: Install Nox
        run: |
          pipx install --pip-args=--constraint=.github/workflows/constraints.txt nox==2026.4.10
          pipx inject --pip-args=--constraint=.github/workflows/constraints.txt nox nox-poetry==1.0.3
          nox --version

      - name: Run tests
        run: |
          nox --force-color --session=tests

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-python-3.10-ubuntu
          path: "htmlcov/index.html"
